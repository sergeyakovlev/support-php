name: sergeyakovlev_support

services:
  php:
    build:
      args:
        GID: ${GID:-1000}
        UID: ${UID:-1000}
        USERNAME: ${USERNAME:-developer}
      context: ./docker/php/
    container_name: php
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      - ./:/var/www/html/
      - composer-cache:/home/${USERNAME:-developer}/.cache/composer

volumes:
  composer-cache:
